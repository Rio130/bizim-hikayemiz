name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v7
      - name: Node.js hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Siteyi oluştur
        run: npm run build
      - name: Pages'i hazırla
        uses: actions/configure-pages@v6
      - name: Çıktıyı yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v5
